@if (isLoading()) {
  <mat-spinner />
} @else {
  <div class="list-container">
    <h1 class="list-header">Todo List</h1>

    <div class="list-with-description">
      <ul class="list">
        @for (task of service.items(); track task.id) {
          <to-do-list-item
            [task]="task"
            [onDeleteCallback]="onDelete.bind(this)"
            [isSelected]="service.selectedItem()?.id === task.id"
            (dblclick)="selectItem(task.id)"
            showTooltip
            [taskDescription]="task.description"
          ></to-do-list-item>
        }
      </ul>
      <div class="editor">
        @if (shouldShowEditor()) {
          <input
            matInput
            type="text"
            placeholder="Enter new text..."
            [value]="service.selectedItem()!.title"
            (input)="onEditorInputChange($event)"
          />
          <button-component
            title="Update task"
            [disabled]="editorInputDisabled()"
            (click)="onUpdate()"
          ></button-component>
        }
      </div>
    </div>
    <div class="add-task-with-description-container">
      <div class="add-task-container">
        <input
          matInput
          type="text"
          class="add-task-input"
          placeholder="Add your new todo"
          [value]="inputText()"
          (input)="onInputChange($event)"
        />
        <button-component
          title="Add task"
          [disabled]="inputDisabled()"
          (click)="onAdd()"
        ></button-component>
      </div>
      <div class="add-task-description">
        <textarea
          matInput
          rows="5"
          [value]="descriptionText()"
          (input)="onDescriptionChange($event)"
        ></textarea>
      </div>
    </div>
  </div>
}
